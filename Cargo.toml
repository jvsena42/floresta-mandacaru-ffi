[package]
name = "floresta-ffi"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
uniffi = { version = "0.31.1", features = ["cli"] }
floresta-node = { git = "https://github.com/jvsena42/Floresta-mandacaru", branch = "feat/enable-bitcoinkernel-validation", features = ["json-rpc", "compact-filters"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
bitcoin = "0.32"
rustreexo = "0.5"
tokio = { version = "1.48", features = ["rt-multi-thread"] }
tracing = "0.1"

[build-dependencies]
uniffi = { version = "0.31.1", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi-bindgen.rs"

[lib]
crate-type = ["cdylib"]
name = "florestad_ffi"

[dev-dependencies]
uniffi = { version = "0.31.1", features = ["bindgen"] }

[features]
zmq-server = ["floresta-node/zmq-server"]

# Android-optimized release profile (matches upstream getfloresta/floresta-ffi).
[profile.release-smaller]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# bitcoinkernel's upstream build.rs cannot cross-compile Bitcoin Core's C++ for
# Android; this fork of the -sys crate feeds the NDK CMake toolchain file so the
# aarch64-linux-android target links.
[patch.crates-io]
bitcoinkernel = { git = "https://github.com/jaoleal/rust-bitcoinkernel", branch = "android_support" }
